name: Manual Build APK

on:
  workflow_dispatch:   # 仅保留手动触发，去掉 PR
    inputs:
      flavor:
        description: 'Build flavor'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 直接 assemble，不加签名（release 也能打，但未签名）
      - name: Build APK
        run: ./gradlew assemble${{ github.event.inputs.flavor }}

      # 上传构件（debug 路径确定存在）
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.flavor }}
          path: |
            app/*.apk
