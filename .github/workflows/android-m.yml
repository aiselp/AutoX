name: Manual Build APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assemble${{ github.event.inputs.flavor }}

      # 修复：指向 Gradle 实际输出目录
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.flavor }}
          path: app/build/outputs/apk/${{ github.event.inputs.flavor }}/*.apk
